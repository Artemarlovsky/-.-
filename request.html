<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Оставить заявку — ЛесГЛОНАСС</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<nav style="background:#1f3b1f; padding:15px;">
  <div style="max-width:900px; margin:auto; display:flex; gap:25px;">
    <a href="company.html" style="color:white; text-decoration:none;">О компании</a>
    <a href="services.html" style="color:white; text-decoration:none;">Услуги</a>
    <a href="contacts.html" style="color:white; text-decoration:none;">Контакты</a>
    <a href="request.html" style="color:white; text-decoration:none;">Оставить заявку</a>
  </div>
</nav>

<div class="section" style="max-width:900px; margin:40px auto; background:white; padding:30px; border-radius:10px;">
  <h1>Оставить заявку</h1>

  <form id="contactForm" onsubmit="sendMessage(event)">
    <label>Ваше имя</label><br>
    <input type="text" id="name" required style="width:100%; padding:10px; margin:10px 0;">

    <label>Телефон</label><br>
    <input type="text" id="phone" required style="width:100%; padding:10px; margin:10px 0;">

    <label>Комментарий</label><br>
    <textarea id="message" required style="width:100%; padding:10px; margin:10px 0; height:120px;"></textarea>

    <button type="submit" style="padding:12px 20px; background:#1f3b1f; color:white; border:none; border-radius:6px; font-size:16px;">
      Отправить
    </button>
  </form>

  <script>
    function sendMessage(event) {
      event.preventDefault();
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const message = document.getElementById('message').value;

      const text = encodeURIComponent(
        `Заявка с сайта ЛесГЛОНАСС:\n\nИмя: ${name}\nТелефон: ${phone}\nСообщение: ${message}`
      );

      window.location.href = `https://wa.me/79990834322?text=${text}`;
    }
  </script>
</div>

</body>
</html>
